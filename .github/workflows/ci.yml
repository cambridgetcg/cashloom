name: CI

# Typecheck + test the sovereign node, build its local UI, and build the atlas
# on every push / PR to main, so a regression can't merge quietly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sovereign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun install --frozen-lockfile && bun run test && bun run build
        working-directory: sovereign/ui

  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx tsc --noEmit
      - run: bun run build
