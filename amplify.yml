version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's default image guarantees npm, not Bun. Pin the ephemeral
        # build tool, then let the repository lockfile pin every site package.
        - npm install --global bun@1.3.13
        - cd atlas && bun install --frozen-lockfile
    build:
      commands:
        - cd atlas && bun run test && bun run typecheck && bun run build
  artifacts:
    baseDirectory: atlas/dist
    files:
      - '**/*'
  cache:
    paths:
      - atlas/node_modules/**/*
