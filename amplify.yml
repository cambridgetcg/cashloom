version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd atlas
        - npm install --legacy-peer-deps
    build:
      commands:
        - cd atlas
        # Amplify does not deploy the Cloudflare Pages same-origin Function.
        # Keep this fallback build on the public read-only API origin.
        - VITE_CASHLOOM_API_BASE=https://cashloom-api.fly.dev npm run build
  artifacts:
    baseDirectory: atlas/dist
    files:
      - '**/*'
  cache:
    paths:
      - atlas/node_modules/**/*
