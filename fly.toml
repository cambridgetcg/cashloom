# cashloom-api — the hosted MONEYWORLD info door (CASHLOOM_MODE landed as its
# own entrypoint: info-server.ts; see INFORM.md). One small machine stays warm
# so the public read door keeps its verified snapshot/cache across visits.
#
# Configured RPC endpoints may contain provider credentials. Public receipts
# cite chain documentation or contract explorers and never echo connection URLs.
app = "cashloom-api"
primary_region = "lhr"

[http_service]
  internal_port = 4747
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/meta"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
